<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="../static/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/custom.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:700px;">

    <a href="{{ url_for('specialists') }}" class="btn btn-secondary mb-4">
        ← Back to Specialists
    </a>

    <div class="card shadow-lg p-4">
        <h3 class="mb-4 text-center">Patient Registration</h3>

        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>First Name</label>
                    <input type="text" name="firstname" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Last Name</label>
                    <input type="text" name="lastname" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="07XXXXXXXX" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>County</label>
                    <select name="county" class="form-control" required>
                        <option value="">-- Select County --</option>
                        <option>Nairobi</option>
                        <option>Mombasa</option>
                        <option>Kisumu</option>
                        <option>Nakuru</option>
                        <option>Uasin Gishu</option>
                        <option>Kiambu</option>
                        <option>Machakos</option>
                        <option>Kajiado</option>
                        <option>Meru</option>
                        <option>Nyeri</option>
                        <option>Kakamega</option>
                        <option>Bungoma</option>
                        <option>Kilifi</option>
                        <option>Kericho</option>
                        <option>Garissa</option>
                        <!-- add remaining counties as needed -->
                    </select>
                </div>

                <div class="col-md-12 mb-3">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="3" required></textarea>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Password</label>
                    <input type="password" name="password" id="password" class="form-control" maxlength="6" required>
                    <small class="text-muted">Maximum 6 characters.</small>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" maxlength="6" required>
                </div>

            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <script>
            // client-side check to match the server-side validation in app.py
            document.querySelector('form').addEventListener('submit', function (e) {
                var password = document.getElementById('password').value;
                var confirmPassword = document.getElementById('confirm_password').value;
                if (password !== confirmPassword) {
                    e.preventDefault();
                    alert('Password and Confirm Password do not match.');
                }
            });
        </script>

        <p class="text-center mt-3">
            Already registered? <a href="{{ url_for('patient_login') }}">Login here</a>
        </p>
    </div>
</div>
</body>
</html>
