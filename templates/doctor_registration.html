<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration</title>

    <!-- Bootstrap CSS -->
    <!-- <link rel="stylesheet" href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css"> -->
     <link rel="stylesheet" href="../static/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/custom.css">

     <style>
        .btn-primary1{
            background-color: #993351;
        }
     </style>
    </head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-lg border-0">
 <a href="{{ url_for('specialists') }}" class="btn btn-secondary">
            ← Back to Specialists
        </a>
        <div class="card-header text-white text-center" style="background-color: #993351;">
            <h2>Doctor Registration Form</h2>
            <p class="mb-0">Please fill in all the required details.</p>
        </div>

        {% if success %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ success }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <div class="card-body">
            <!-- after submit buttonthe form POST all doctors details to python flaSK route /doctor_registration-->
           <!-- enctype="multipart/form-data"  because of image/photo -->
            <form action="/doctor_registration" method="POST" enctype="multipart/form-data">

                <div class="row">

                    <!-- ================= COLUMN 1 ================= -->
                    <div class="col-md-4">

                        <!-- First Name -->
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="firstname" required>
                        </div>

                        <!-- Middle Name -->
                        <div class="mb-3">
                            <label class="form-label">Middle Name</label>
                            <input type="text" class="form-control" name="middlename">
                        </div>

                        <!-- Surname -->
                        <div class="mb-3">
                            <label class="form-label">Surname</label>
                            <input type="text" class="form-control" name="surname" required>
                        </div>

                        <!-- ID Number -->
                        <div class="mb-3">
                            <label class="form-label">ID Number</label>
                            <input type="text" class="form-control" name="id_number" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" maxlength="6" required>
                            <small class="text-muted">Maximum 6 characters.</small>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" maxlength="6" required>
                        </div>

                    </div>

                    <!-- ================= COLUMNS 2 & 3 ================= -->
                    <div class="col-md-8">

                        <div class="row">

                            <!-- Column 2 -->
                            <div class="col-md-6">

                                <!-- Business Phone -->
                                <div class="mb-3">
                                    <label class="form-label">Business Phone</label>
                                    <input type="tel" class="form-control" name="business_phone" required>
                                </div>

                                <!-- Personal Phone -->
                                <div class="mb-3">
                                    <label class="form-label">Personal Phone</label>
                                    <input type="tel" class="form-control" name="personal_phone" required>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>

                                <!-- Language -->
                                <div class="mb-3">
                                    <label class="form-label">Language</label>
                                    <input type="text" class="form-control" name="language" placeholder="English, Swahili">
                                </div>

                                <!-- Profile Photo -->
                                <div class="mb-3">
                                    <label class="form-label">Profile Photo</label>
                                    <input type="file" class="form-control" name="profile_photo" accept="image/*">
                                </div>

                            </div>

                            <!-- Column 3 -->
                            <div class="col-md-6">

                                <!-- Gender -->
                                <div class="mb-3">
                                    <label class="form-label">Gender</label>
                                    <select class="form-select" name="gender" required>
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <!-- County -->
                                <div class="mb-3">
                                    <label class="form-label">County</label>
                                    <select class="form-select" name="county" required>
                                        <option value="">Select County</option>
                                        <option>Nairobi</option>
                                        <option>Kiambu</option>
                                        <option>Mombasa</option>
                                        <option>Kisumu</option>
                                        <option>Nakuru</option>
                                        <option>Machakos</option>
                                        <option>Uasin Gishu</option>
                                        <option>Kakamega</option>
                                        <option>Meru</option>
                                        <option>Nyeri</option>
                                    </select>
                                </div>

                                <!-- Address -->
                                <div class="mb-3">
                                    <label class="form-label">Address</label>
                                    <input type="text" class="form-control" name="address" required>
                                </div>

                                <!-- Speciality -->
                                <div class="mb-3">
                                    <label class="form-label">Speciality</label>
                                    <select class="form-select" name="speciality" required>
                                        <option value="">Select Speciality</option>
                                        <option>General Physician</option>
                                        <option>Cardiologist</option>
                                        <option>Dermatologist</option>
                                        <option>Neurologist</option>
                                        <option>Pediatrician</option>
                                        <option>Orthopedic Surgeon</option>
                                        <option>Gynecologist</option>
                                        <option>Psychiatrist</option>
                                        <option>Oncologist</option>
                                        <option>Radiologist</option>
                                        <option>ENT Specialist</option>
                                        <option>Ophthalmologist</option>
                                        <option>Dentist</option>
                                        <option>Urologist</option>
                                    </select>
                                </div>

                            </div>

                        </div>

                        <!-- Profile Description (spans Column 2 and 3 only) -->
                        <div class="row">
                            <div class="col-12">
                                <div class="mb-3">
                                    <label class="form-label">Profile Description</label>
                                    <textarea class="form-control"
                                              name="profile_description"
                                              rows="6"
                                              placeholder="Describe your qualifications, experience, achievements, and areas of specialization..."></textarea>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>

                <!-- Buttons -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg px-5">
                        Register Doctor
                    </button>

                    <button type="reset" class="btn btn-secondary btn-lg px-5 ms-2">
                        Clear
                    </button>
                    <br><br>
                    <a href="/" class="btn btn-secondary btn-md">Back Home</a>
                </div>

            </form>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="../static/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.js"></script>

<script>
    // client-side check to match the server-side validation in app.py
    document.querySelector('form').addEventListener('submit', function (e) {
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm_password').value;
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Password and Confirm Password do not match.');
        }
    });
</script>

</body>
</html>
